<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="gotr.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>GOTR Portal Timer</title>
<style>
/* Layout: a single vertical strip that fills the split-screen pane top to bottom; the whole strip flashes */
:root{
  color-scheme:dark;
  --bg:#0b0d12; --bar:#151a24; --line:#2a3242; --fg:#e8ecf3; --muted:#8a93a6;
  --warn:#ffd23f; --warn-ink:#1a1400; --live:#3ddc97; --live-ink:#04150d; --stop:#ff5c5c;
  --display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --body:"Inter Tight",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none}
.strip{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(3px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(3px,env(safe-area-inset-left,0px));
  background:var(--bar);transition:background .15s}
.time{font-family:var(--display);font-weight:700;font-size:clamp(14px,32vw,30px);line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;width:6px;min-height:20px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--muted)}
.btn{width:100%;max-width:56px;aspect-ratio:1;border:0;border-radius:6px;cursor:pointer;
  font:700 clamp(12px,26vw,20px) var(--body);line-height:1;display:grid;place-items:center;padding:0}
.btn.start{background:var(--live);color:var(--live-ink)}
.btn.stopb{background:var(--stop);color:#1a0505}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.gear{background:none;border:0;color:var(--muted);font-size:14px;padding:2px;cursor:pointer}
.btn:focus-visible,.gear:focus-visible{outline:2px solid var(--warn);outline-offset:1px}
.strip.warn{animation:flash .5s steps(1) infinite}
@keyframes flash{0%{background:var(--warn);color:var(--warn-ink)}50%{background:var(--bar);color:var(--warn)}}
.strip.warn .track{background:rgba(0,0,0,.25)}
.strip.live{background:var(--live);color:var(--live-ink)}
.strip.live .track{background:rgba(0,0,0,.2)} .strip.live .track i{background:var(--live-ink)}
.strip.live .btn.ghost{border-color:var(--live-ink);color:var(--live-ink)}
@media (prefers-reduced-motion:reduce){.strip.warn{animation:none;background:var(--warn);color:var(--warn-ink)}}
.panel{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:12px max(10px,env(safe-area-inset-left,0px));
  font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:10px;user-select:text}
.panel label{display:flex;flex-direction:column;gap:3px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.panel input[type=number]{width:100%;box-sizing:border-box;background:var(--bar);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:6px;font:500 .95rem var(--body)}
.panel .chk{flex-direction:row;align-items:center;text-transform:none;letter-spacing:0;font-size:.8rem}
.panel p{margin:0;line-height:1.4}
.panel .close{background:var(--fg);color:var(--bg);border:0;border-radius:5px;padding:8px;font:600 .85rem var(--body)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter+Tight:wght@500;600;700&display=swap">
</head><body>

<div class="strip" id="bar">
  <span class="time" id="time">--:--</span>
  <div class="track"><i id="prog"></i></div>
  <button class="btn ghost" id="sync" aria-label="Portal appeared, resync">P</button>
  <button class="btn start" id="toggle" aria-label="Start">▶</button>
  <button class="gear" id="gear" aria-label="Timings">⚙</button>
</div>

<div class="panel" id="panel" hidden>
  <label for="first">First portal (s)<input id="first" type="number" min="10" value="160"></label>
  <label for="every">Then every (s)<input id="every" type="number" min="10" value="140"></label>
  <label for="warnS">Flash before (s)<input id="warnS" type="number" min="1" value="10"></label>
  <label for="open">Portal open (s)<input id="open" type="number" min="0" value="25"></label>
  <label class="chk" for="beep"><input id="beep" type="checkbox" checked> Beep</label>
  <p>▶ start, ■ stop. Tap P when a portal appears to resync.</p>
  <button class="close" id="close">Done</button>
</div>

<script>
const $=id=>document.getElementById(id);
const bar=$('bar'),timeEl=$('time'),prog=$('prog'),toggle=$('toggle');
const keys=['first','every','warnS','open'];
try{const s=JSON.parse(localStorage.getItem('gotr')||'{}');keys.forEach(k=>{if(s[k])$(k).value=s[k]});if(s.beep===false)$('beep').checked=false}catch(e){}
function save(){try{const o={beep:$('beep').checked};keys.forEach(k=>o[k]=+$(k).value);localStorage.setItem('gotr',JSON.stringify(o))}catch(e){}}
document.querySelectorAll('.panel input').forEach(i=>i.addEventListener('change',save));
$('gear').onclick=()=>{$('panel').hidden=false};
$('close').onclick=()=>{save();$('panel').hidden=true};
const cfg=k=>Math.max(1,+$(k).value||0);

let running=false,start=0,anchor=null,timer=0,beeped=-1,ctx=null,lock=null;
function base(){return anchor??(start+cfg('first')*1000)}
function nextSpawn(now){
  const every=cfg('every')*1000,b=base();
  if(now<b) return {at:b,len:anchor?every:cfg('first')*1000};
  return {at:b+(Math.floor((now-b)/every)+1)*every,len:every};
}
function prevSpawn(now){const every=cfg('every')*1000,b=base();return now<b?null:b+Math.floor((now-b)/every)*every}
function fmt(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function beep(){
  if(!$('beep').checked)return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    [0,.18].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.25,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.15);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.16)})}catch(e){}
}
function tick(){
  if(!running)return;
  const now=Date.now(),nx=nextSpawn(now),left=nx.at-now,pv=prevSpawn(now);
  bar.classList.remove('warn','live');
  timeEl.textContent=fmt(left);
  if(pv!==null&&now-pv<cfg('open')*1000) bar.classList.add('live');
  else if(left<=cfg('warnS')*1000){bar.classList.add('warn');if(beeped!==nx.at){beeped=nx.at;beep()}}
  prog.style.height=Math.min(100,(1-left/nx.len)*100)+'%';
}
async function wake(){try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
function startRun(){running=true;start=Date.now();anchor=null;beeped=-1;toggle.textContent='■';toggle.className='btn stopb';toggle.setAttribute('aria-label','Stop');
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
  wake();clearInterval(timer);tick();timer=setInterval(tick,200)}
function stopRun(){running=false;clearInterval(timer);bar.classList.remove('warn','live');timeEl.textContent='--:--';prog.style.height='0';
  toggle.textContent='▶';toggle.className='btn start';toggle.setAttribute('aria-label','Start');try{lock?.release()}catch(e){}}
toggle.onclick=()=>running?stopRun():startRun();
$('sync').onclick=()=>{if(!running)startRun();anchor=Date.now();beeped=-1;tick()};
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible'){wake();tick()}});
window.addEventListener('focus',tick);
</script>
</body></html>
