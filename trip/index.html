<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* South African flag colours */
    --sa-green:#007A4D; --sa-gold:#FFB612; --sa-red:#DE3831; --sa-blue:#002395; --sa-black:#141414;
    --bg:#FAF4E8; --card:#fff; --ink:#1A1A1A; --muted:#6E6A60; --line:#EADFCB;
    --teal:#007A4D; --teal-d:#00563A; --teal-l:#E2F1E9; --coral:#DE3831; --sand:#F3E7D1;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* Header */
  .top{background:linear-gradient(160deg,#00603D 0%,var(--sa-green) 55%,#008C58 100%);color:#FFFDF7;padding:18px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,60,35,.25)}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(90deg,var(--sa-red) 0 16.6%,#fff 16.6% 33.3%,var(--sa-green) 33.3% 50%,var(--sa-gold) 50% 66.6%,var(--sa-black) 66.6% 83.3%,var(--sa-blue) 83.3% 100%)}
  .flag{font-size:20px;vertical-align:2px;margin-left:6px}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
  .sub{opacity:.82;font-size:13.5px;margin-top:4px}
  .icon-btn{background:rgba(255,255,255,.14);border:0;border-radius:12px;width:40px;height:40px;font-size:18px;flex:none}
  .members{display:flex;gap:6px;flex-wrap:wrap;margin:10px auto 0;max-width:760px}
  .mchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:99px;padding:3px 10px 3px 3px;font-size:13px}
  .mchip.me{background:rgba(255,255,255,.26)}
  .mchip b{font-weight:600;opacity:.85}
  .av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .tabs{display:flex;gap:6px;margin:12px auto 0;max-width:760px;background:rgba(0,0,0,.16);padding:4px;border-radius:12px}
  .tabs button{flex:1;border:0;background:transparent;color:#FDF8F0;padding:8px;border-radius:9px;font-weight:600;opacity:.8}
  .tabs button.on{background:var(--sa-gold);color:var(--sa-black);opacity:1}
  .count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--sa-red);color:#fff;font-size:11px;line-height:18px;margin-left:4px}

  main{max-width:760px;margin:0 auto;padding:18px 14px 110px}
  .banner{max-width:760px;margin:10px auto 0;padding:10px 14px;background:#FFF3D6;border:1px solid #F1DCA6;border-radius:12px;font-size:13.5px;width:calc(100% - 28px)}

  /* Day strip */
  .strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
  .strip::-webkit-scrollbar{display:none}
  .dchip{flex:none;scroll-snap-align:center;width:58px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .dchip .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .dchip .dn{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600;line-height:1.1}
  .dchip .dots{height:8px;font-size:9px;letter-spacing:1px;color:var(--sa-red);line-height:8px}
  .dchip.today{border-color:var(--sa-gold);border-width:2px}
  .dchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .dchip.on .dow{color:rgba(255,255,255,.8)}
  .dchip.on .dots{color:var(--sa-gold)}
  .dchip.all .dn{font-size:15px;font-family:"DM Sans";font-weight:700;padding:3px 0 2px}

  /* Day blocks */
  .day{margin-top:8px}
  .day + .day{margin-top:22px}
  .dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 10px}
  .dhead h2{font-family:Fraunces,Georgia,serif;font-size:20px;margin:0;font-weight:600}
  .dhead .dn2{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tag-today{display:inline-block;background:var(--sa-gold);color:var(--sa-black);font:700 10.5px "DM Sans";text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:2px 6px;vertical-align:3px;margin-left:6px}
  .ghost{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--teal-d);flex:none}

  .card{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 14px 12px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,42,48,.04);cursor:pointer}
  .card:active{transform:scale(.99)}
  .card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .time{width:66px;flex:none;padding-top:1px}
  .t1{white-space:nowrap}
  .t1{font-weight:700;font-size:14.5px}
  .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
  .body{flex:1;min-width:0}
  .ttl{font-weight:700;font-size:16px;line-height:1.25;word-wrap:break-word}
  .emo{margin-right:6px}
  .meta{color:var(--muted);font-size:13.5px;margin-top:4px;word-wrap:break-word}
  .who{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--sand);border-radius:99px;padding:2px 9px 2px 2px;font-size:12px;font-weight:500}
  .pill.every{padding:3px 9px;background:var(--teal-l);color:var(--teal-d);font-weight:600}
  .pill .av{width:18px;height:18px;font-size:9.5px}
  .notes{font-size:13.5px;margin-top:7px;color:#3C4A52;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .link{display:inline-block;margin-top:6px;font-size:13px;color:var(--teal);font-weight:600;word-break:break-all}
  .dist{margin-top:7px;font-size:13px;color:var(--teal-d);background:var(--teal-l);border-radius:8px;padding:5px 9px;line-height:1.45}
  .dist a{color:inherit;font-weight:700}
  .geo-note{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .clash{margin-top:7px;font-size:12.5px;color:#9A4A12;background:#FFF1E3;border-radius:8px;padding:4px 8px}
  .by{font-size:11.5px;color:var(--muted);margin-top:7px}

  .empty{border:1.5px dashed #DCCFBD;border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:14px}
  .empty.slim{padding:10px;font-size:13px}
  .dchip{overflow:hidden;position:relative}
  .dchip .sbar{position:absolute;left:0;right:0;bottom:0;height:5px}
  .dchip .fl{position:absolute;bottom:6px;right:5px;font-size:9px;line-height:9px}
  .bar{display:flex;align-items:center;gap:11px;border-radius:14px;padding:10px 13px;margin-bottom:8px;color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .bar:active{transform:scale(.99)}
  .bar .be{font-size:22px;flex:none}
  .bar .bm{font-weight:700;font-size:15px;line-height:1.25;word-wrap:break-word}
  .bar .bs{font-size:12.5px;opacity:.88;margin-top:2px;word-wrap:break-word}
  .bar .bb{min-width:0;flex:1}
  .bar.flight{background:linear-gradient(120deg,#001A70,var(--sa-blue))}
  .bar.outline{background:#fff;color:var(--ink);border:1.5px dashed var(--c);box-shadow:none}
  .bar.outline .bs{color:var(--muted);opacity:1}
  .tabs button{font-size:14px;padding:8px 4px}
  /* Whole-trip horizontal timeline */
  .tl-wrap{overflow-x:auto;margin:6px -14px 0;padding:2px 14px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .tl{display:grid;row-gap:6px;width:max-content;position:relative}
  .tl-h{text-align:center;padding:6px 2px 5px;margin:0 3px 2px;border-radius:12px;background:#fff;border:1.5px solid var(--line);cursor:pointer}
  .tl-h .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .tl-h .dn{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;line-height:1.15}
  .tl-h .mo{font-size:10.5px;color:var(--muted)}
  .tl-h.today{border-color:var(--sa-gold);border-width:2px;background:#FFF8E6}
  .tl-bar{margin:0 3px;border-radius:10px;padding:6px 9px;color:#fff;font-size:12.5px;font-weight:600;min-height:32px;display:flex;align-items:center;cursor:pointer;overflow:clip;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .tl-bar .st{position:sticky;left:20px;display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
  .tl-bar.flight span.t{white-space:normal;line-height:1.25}
  .tl-bar span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-bar.flight{background:linear-gradient(120deg,#001A70,var(--sa-blue))}
  .tl-bar.stay{border-radius:16px}
  .tl-bar:active{transform:scale(.98)}
  .tl-lbl{position:sticky;left:0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 3px 0}
  .tl-col{border-left:1.5px dashed var(--line);padding:4px 3px 0;min-height:140px}
  .tl-col.today{background:rgba(255,182,18,.09);border-radius:0 0 10px 10px}
  .tcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;line-height:1.3;cursor:pointer}
  .tcard .tt{font-size:11px;color:var(--muted);font-weight:700}
  .tcard .tn{font-weight:700;word-wrap:break-word}
  .tl-add{display:block;width:100%;border:1.5px dashed #CFE0DC;background:transparent;border-radius:10px;padding:5px;color:var(--teal);font-weight:700;font-size:13px}
  .tl-free{font-size:12px;color:var(--muted);text-align:center;padding:8px 2px}
  .addline{display:block;width:100%;margin-top:4px;border:1.5px dashed #CFE0DC;background:transparent;border-radius:12px;padding:10px;color:var(--teal);font-weight:600}
  .section-note{color:var(--muted);font-size:13.5px;margin:6px 2px 12px}
  h3.sec{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600;margin:22px 2px 10px}

  .msg{text-align:center;padding:40px 18px}
  .msg .big{font-size:44px}
  .msg h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:10px 0 6px}
  .msg p{color:var(--muted);margin:0 auto 18px;max-width:360px;line-height:1.45}
  .loading{padding:40px;text-align:center;color:var(--muted)}

  .fab{position:fixed;right:18px;bottom:22px;z-index:6;background:var(--sa-red);color:#fff;border:0;border-radius:99px;padding:15px 22px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(222,56,49,.4)}
  .primary{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px}

  /* Sheet */
  .sheet-wrap{position:fixed;inset:0;background:rgba(20,30,34,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px 24px;animation:up .22s ease-out}
  @media(min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:42px;height:5px;border-radius:3px;background:#D9CDBB;margin:4px auto 10px}
  .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .shead h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin:0}
  .x{border:0;background:var(--sand);width:34px;height:34px;border-radius:50%;font-size:16px}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  input.in,select.in,textarea.in{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--teal)}
  textarea.in{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .chip.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d);font-weight:700}
  .chip .av{width:20px;height:20px;font-size:10px}
  .actions{display:flex;gap:10px;margin-top:22px;align-items:center}
  .actions .primary{flex:1}
  .danger{border:1.5px solid #F0C8BE;background:#fff;color:#B4402A;border-radius:12px;padding:11px 14px;font-weight:700}
  .danger.confirm{background:#B4402A;color:#fff;border-color:#B4402A}
  .mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .swatch{width:40px;height:40px;border-radius:12px;border:0;flex:none;color:#fff;font-weight:700}
  .mrow .in{flex:1}
  .rm{border:0;background:var(--sand);width:40px;height:40px;border-radius:12px;flex:none}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .err{color:#B4402A;font-size:13px;margin-top:10px;min-height:1em}
  .ro-note{background:var(--teal-l);color:var(--teal-d);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="top">
  <div class="title-row">
    <div>
      <h1 id="tripName">Family Trip</h1>
      <div id="tripDates" class="sub">Getting the plan…</div>
    </div>
    <div style="display:flex;gap:8px"><button id="shareBtn" class="icon-btn hidden" aria-label="Share the trip link">🔗</button><button id="settingsBtn" class="icon-btn hidden" aria-label="Trip settings">⚙️</button></div>
  </div>
  <div id="members" class="members"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="days" class="on">📅 Calendar</button>
    <button data-tab="travel">🧳 Travel</button>
    <button data-tab="ideas">💡 Ideas<span id="ideaCount"></span></button>
  </nav>
</header>
<div id="banner" class="banner hidden"></div>
<main id="main"><div class="loading">Loading the plan…</div></main>
<button id="fab" class="fab hidden">＋ Add</button>
<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>

<script type="module">
/* Shared storage: public Nostr relays (free, no accounts). Everything is
   encrypted with a key that only exists in the trip link (#trip-…), so only
   people with the link can read or change the plan. */
const RELAYS = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://offchain.pub"];

(function(){
  const CATS = {
    activity:{label:'Activity',emoji:'🦁',color:'#007A4D'},
    food:{label:'Food & braai',emoji:'🔥',color:'#DE3831'},
    travel:{label:'Travel',emoji:'🚙',color:'#002395'},
    relax:{label:'Chill time',emoji:'🏖️',color:'#E0A100'},
    booking:{label:'Booking',emoji:'🎟️',color:'#141414'},
  };
  const PALETTE = ['#DE3831','#007A4D','#E0A100','#002395','#141414','#C2185B','#00897B','#8D5A2B'];

  const S = {
    booting:true, db:null, user:null, me:null, canWrite:null, readOnly:false,
    trip:null, tripLoaded:false, acts:[], stays:[], flights:[], tab:'days', sel:null, names:{},
    confirmed:false, offline:false, loadErr:false, scrollToSel:true
  };
  try{ const s = localStorage.getItem('tripSel'); if(s) S.sel = s; const t = localStorage.getItem('tripTab'); if(t==='ideas'||t==='days'||t==='travel') S.tab = t; }catch(e){}

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const validDate = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(pd(s));
  const todayStr = () => ds(new Date());
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const uid = () => Math.random().toString(36).slice(2,10);
  const mins = t => { if(!/^\d{2}:\d{2}$/.test(t||'')) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
  const fmtTime = t => { const m = mins(t); if(m==null) return ''; return new Date(2000,0,1,Math.floor(m/60),m%60).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
  const fmtLong = s => pd(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const fmtShort = s => pd(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  const safeUrl = u => { try{ const x = new URL(u); return (x.protocol==='https:'||x.protocol==='http:') ? x.href : ''; }catch(e){ return ''; } };

  function tripDays(){
    if(!S.trip || !validDate(S.trip.start) || !validDate(S.trip.end)) return [];
    const out=[]; let d = pd(S.trip.start); const e = pd(S.trip.end);
    while(d<=e && out.length<92){ out.push(ds(d)); d = addDays(d,1); }
    return out;
  }
  function members(){ return Array.isArray(S.trip && S.trip.members) ? S.trip.members.filter(m => m && typeof m.id==='string') : []; }
  function memberById(id){ return members().find(m => m.id===id); }
  function initials(n){ const p = String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0] + (p[1]?p[1][0]:'')).toUpperCase(); }
  function av(m){ return `<span class="av" style="background:${esc(m.color||'#888')}">${esc(initials(m.name))}</span>`; }
  function canEdit(){ return !!S.db && !S.readOnly && S.canWrite!==false; }

  function norm(doc){
    const d = doc.data() || {};
    return {
      id:doc.id, title:String(d.title||'Untitled').slice(0,200),
      date: validDate(d.date) ? d.date : '',
      start: mins(d.start)!=null ? d.start : '', end: mins(d.end)!=null ? d.end : '',
      place:String(d.place||''), cat: CATS[d.cat] ? d.cat : 'activity',
      who: Array.isArray(d.who) ? d.who.filter(x => typeof x==='string') : [],
      notes:String(d.notes||''), link:String(d.link||''),
      by: typeof d.by==='string' ? d.by : '', createdAt: Number(d.createdAt)||0, geo: cleanGeo(d.geo)
    };
  }
  function sortActs(a,b){
    const am = mins(a.start), bm = mins(b.start);
    if(am==null && bm==null) return a.createdAt-b.createdAt;
    if(am==null) return 1; if(bm==null) return -1;
    return am-bm || a.createdAt-b.createdAt;
  }
  function actsOn(day){ return S.acts.filter(a => a.date===day).sort(sortActs); }
  function sharesPeople(a,b){
    const ids = members().map(m=>m.id);
    const A = a.who.filter(x=>ids.includes(x)), B = b.who.filter(x=>ids.includes(x));
    if(!A.length || !B.length) return true;
    return A.some(x => B.includes(x));
  }
  function clashes(list){
    const map = new Map();
    const timed = list.filter(a => mins(a.start)!=null).map(a => {
      const s = mins(a.start); let e = mins(a.end); if(e==null || e<=s) e = s+60;
      return {a,s,e};
    });
    for(let i=0;i<timed.length;i++) for(let j=i+1;j<timed.length;j++){
      const x = timed[i], y = timed[j];
      if(x.s < y.e && y.s < x.e && sharesPeople(x.a,y.a)){
        (map.get(x.a.id) || map.set(x.a.id,[]).get(x.a.id)).push(y.a.title);
        (map.get(y.a.id) || map.set(y.a.id,[]).get(y.a.id)).push(x.a.title);
      }
    }
    return map;
  }

  function whoHtml(who){

    if(!sel.length || sel.length===ms.length) return `<span class="pill every">👨‍👩‍👧‍👦 Everyone</span>`;

  function askWhoIfNeeded(force){

      <div class="chips" id="whoPick">${members().map(m => `<button type="button" class="chip ${m.id===S.me?'on':''}" data-me="${esc(m.id)}" style="font-size:16px;padding:10px 14px">${av(m)}${esc(m.name)}</button>`).join('')}</div>`);

  }
  /* ---------- Maps & distances ----------
     Places are found with OpenStreetMap (Nominatim) and drive times with OSRM.
     Both are free and need no account. Results are cached on each phone. */
  const GEO_CC = 'za';
  function cleanGeo(g){ return (g && isFinite(g.lat) && isFinite(g.lng) && Math.abs(g.lat)<=90 && Math.abs(g.lng)<=180) ? {lat:+g.lat, lng:+g.lng, label:String(g.label||'').slice(0,160)} : null; }
  function parseCoords(s){
    if(!s) return null;
    const m = s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/) || s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)
      || s.match(/[?&](?:q|query|ll|destination|center)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i)
      || s.match(/^\s*(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})\s*$/);
    return m ? cleanGeo({lat:+m[1], lng:+m[2]}) : null;
  }
  function placeFromLink(u){
    try{
      const x = new URL(u);
      const m = x.pathname.match(/\/maps\/place\/([^/]+)/);
      if(m) return decodeURIComponent(m[1].replace(/\+/g,' '));
      const q = x.searchParams.get('q') || x.searchParams.get('query');
      if(q && !parseCoords(q)) return q;
    }catch(e){}
    return '';
  }
  let geoChain = Promise.resolve();
  function nominatim(q){
    q = String(q||'').trim(); if(q.length<3) return Promise.resolve(null);
    const key = 'geo:' + q.toLowerCase();
    const c = lsGet(key); if(c===false) return Promise.resolve(null); if(c) return Promise.resolve(c);
    const run = async cc => {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1' + (cc?'&countrycodes='+cc:'') + '&q=' + encodeURIComponent(q), {headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('geo ' + r.status);
      const j = await r.json();
      return j && j[0] ? cleanGeo({lat:+j[0].lat, lng:+j[0].lon, label:String(j[0].display_name||'').split(',').slice(0,3).join(',').trim()}) : null;
    };
    const p = geoChain.then(async () => { let g = await run(GEO_CC); if(!g) g = await run(''); lsSet(key, g || false); return g; });
    geoChain = p.catch(() => {}).then(() => new Promise(r => setTimeout(r, 1100)));   // be polite: 1 lookup a second
    return p;
  }
  async function resolveGeo(item, kind){
    const tries = kind==='stay' ? [item.link, item.address, item.name] : [item.link, item.place];
    for(const t of tries){ const g = parseCoords(t); if(g) return {...g, label: g.label || (kind==='stay' ? item.name : (item.place || item.title))}; }
    const names = kind==='stay'
      ? [placeFromLink(item.link), item.address, item.name]
      : [placeFromLink(item.link), item.place, item.place && item.title ? item.title + ', ' + item.place : '', item.title];
    let n = 0;
    for(const q of names){ if(!q || n>=3) continue; n++; const g = await nominatim(q); if(g) return g; }
    return null;
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(undefined), ms))]);
  const geoSig = (item, kind) => kind==='stay' ? [item.link,item.address,item.name].join('|') : [item.link,item.place,item.title].join('|');
  const memGeo = {}, memDrive = {};
  function geoOf(item, kind){
    if(item.geo) return item.geo;
    const k = kind + ':' + geoSig(item, kind);
    if(k in memGeo) return memGeo[k];
    memGeo[k] = null;
    resolveGeo(item, kind).then(g => { memGeo[k] = g; if(g) render(); }).catch(() => { delete memGeo[k]; });
    return null;
  }
  function hav(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
    const x = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
  function drive(a,b){
    const key = 'drv:' + [a.lat,a.lng,b.lat,b.lng].map(x => x.toFixed(4)).join(',');
    if(key in memDrive) return memDrive[key];
    const c = lsGet(key); if(c){ memDrive[key] = c; return c; }
    memDrive[key] = null;
    fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`)
      .then(r => r.json()).then(j => {
        const r0 = j && j.routes && j.routes[0];
        const v = r0 ? {km:r0.distance/1000, min:r0.duration/60} : {none:true};
        memDrive[key] = v; lsSet(key, v); render();
      }).catch(() => { memDrive[key] = {fail:true}; render(); });
    return null;
  }
  const fmtKm = k => k < 10 ? k.toFixed(1) + ' km' : Math.round(k) + ' km';
  const fmtDur = m => { m = Math.max(1, Math.round(m)); if(m<60) return m + ' min'; const hh = Math.floor(m/60), r = m%60; return hh + ' h' + (r ? ' ' + r : ''); };
  function travelBetween(sg, g){
    const d = drive(sg, g);
    if(d && d.min!=null) return {txt:`${fmtDur(d.min)} drive (${fmtKm(d.km)})`, km:d.km};
    const k = hav(sg, g);
    return {txt: d===null ? `${fmtKm(k)} away` : `${fmtKm(k)} away in a straight line`, km:k};
  }
  function stayOnDay(day){ return stayFor(day) || S.stays.find(s => s.checkOut===day) || null; }
  function distHtml(a){
    if(!S.stays.length) return '';
    const g = geoOf(a, 'act'); if(!g) return '';
    const maps = `<a href="https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}" target="_blank" rel="noopener noreferrer">Map</a>`;
    if(a.date){
      const s = stayOnDay(a.date); if(!s) return '';
      const sg = geoOf(s, 'stay'); if(!sg) return '';
      return `<div class="dist">🚗 ${esc(travelBetween(sg, g).txt)} from ${esc(s.name)} · ${maps}</div>`;
    }
    const rows = S.stays.map(s => { const sg = geoOf(s, 'stay'); return sg ? {s, ...travelBetween(sg, g)} : null; })
      .filter(Boolean).sort((x,y) => x.km-y.km).slice(0,3);
    if(!rows.length) return '';
    return `<div class="dist">${rows.map((r,i) => `${i? '' : '🚗 '}${i?'':'<b>Closest:</b> '}${esc(r.s.name)} — ${esc(r.txt)}`).join('<br>')}<br>${maps}</div>`;
  }
  /* Pasting a share from the Google Maps app gives "Place name https://maps.app.goo.gl/…" — split it. */
  function splitShare(raw){
    raw = String(raw||'').trim();
    const m = raw.match(/https?:\/\/\S+/i);
    if(!m) return {link: raw && !/\s/.test(raw) ? (/^https?:\/\//i.test(raw) ? raw : 'https://' + raw) : '', text: m ? '' : (/\s/.test(raw) ? raw : '')};
    return {link: m[0], text: raw.replace(m[0], '').replace(/\s+/g,' ').trim()};
  }

  function card(a, clash){
    const c = CATS[a.cat];
    let time;
    if(!a.date) time = `<div class="t2">No day yet</div>`;
    else if(a.start) time = `<div class="t1">${esc(fmtTime(a.start))}</div>${a.end?`<div class="t2">to ${esc(fmtTime(a.end))}</div>`:''}`;
    else time = `<div class="t2">Any time</div>`;
    const url = safeUrl(a.link);
    return `<div class="card" role="button" tabindex="0" data-id="${esc(a.id)}" style="--c:${c.color}">
      <div class="time">${time}</div>
      <div class="body">
        <div class="ttl"><span class="emo">${c.emoji}</span>${esc(a.title)}</div>
        ${a.place?`<div class="meta">📍 ${esc(a.place)}</div>`:''}
        <div class="who">${whoHtml(a.who)}</div>
        ${a.notes?`<div class="notes">${esc(a.notes)}</div>`:''}
        ${url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(new URL(url).hostname.replace(/^www\./,''))}</a>`:''}
        ${distHtml(a)}
        ${clash&&clash.length?`<div class="clash">⚠️ Overlaps with ${esc(clash.join(', '))}</div>`:''}
        ${byLine(a)}
      </div>
    </div>`;
  }

  /* ---------- Rendering ---------- */
  function renderHeader(){
    const t = S.trip;
    $('#tripName').innerHTML = esc((t && t.name) ? t.name : 'Family Trip') + '<span class="flag">🇿🇦</span>';
    const days = tripDays();
    if(t && days.length){
      $('#tripDates').textContent = `${fmtShort(days[0])} – ${fmtShort(days[days.length-1])} · ${days.length} day${days.length>1?'s':''}`;
    } else {
      $('#tripDates').textContent = S.booting || !S.tripLoaded ? 'Getting the plan…' : 'Not set up yet';
    }
    $('#members').innerHTML = members().map(m => `<button type="button" class="mchip${m.id===S.me?' me':''}" data-pickme>${av(m)}${esc(m.name)}${m.id===S.me?' <b>(you)</b>':''}</button>`).join('');
    $('#settingsBtn').classList.toggle('hidden', !t);
    $('#shareBtn').classList.toggle('hidden', !(t && BLOB));
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===S.tab));
    $('#tabs').classList.toggle('hidden', !t);
    const ideas = S.acts.filter(a => !a.date).length;
    $('#ideaCount').innerHTML = ideas ? `<span class="count">${ideas}</span>` : '';
  }
  function renderBanner(){
    const b = $('#banner');
    let msg = '';
    if(S.loadErr) msg = "Couldn't load the plan. Try opening the page again a bit later.";
    else if(S.offline) msg = S.tripLoaded ? "Can't reach the shared plan right now, so this may be out of date. It'll catch up once you're connected." : "Can't reach the shared plan yet. Check your connection — it'll load as soon as it connects.";
    if(!msg && S.offline && typeof outbox!=='undefined' && outbox.length) msg = `${outbox.length} change${outbox.length>1?'s':''} saved on this phone — they\u2019ll send when you have signal.`;
    b.textContent = msg; b.classList.toggle('hidden', !msg);
  }
  function msgBox(big,title,text,btn){
    return `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${btn||''}</div>`;
  }

  function render(){
    renderHeader(); renderBanner();
    const main = $('#main');
    const stripEl = $('#strip'); const keepScroll = stripEl ? stripEl.scrollLeft : null;
    $('#fab').classList.toggle('hidden', !(canEdit() && S.trip));
    if(S.booting){ main.innerHTML = `<div class="loading">Loading the plan…</div>`; return; }
    if(S.libFail){ main.innerHTML = msgBox('📡','Couldn\u2019t start the planner','Check your connection, then reload the page.'); return; }
    if(!S.trip && BLOB && !S.confirmed){ main.innerHTML = S.offline ? msgBox('📡','Can\u2019t reach the plan yet','Check your signal. The trip will appear as soon as the phone connects.') : `<div class="loading">Loading the plan…</div>`; return; }
    if(S.missing){ main.innerHTML = msgBox('🤷','Can\u2019t find this trip','This link\u2019s plan no longer exists (plans are removed after 75 days without use). You can start a new one.','<button class="primary" data-newtrip>Start a new trip</button>'); return; }
    if(!S.db){ main.innerHTML = msgBox('📡','Couldn’t start the planner','Check your connection and reload the page.'); return; }
    if(!S.tripLoaded){ main.innerHTML = `<div class="loading">Loading the plan…</div>`; return; }
    if(!S.trip){
      main.innerHTML = canEdit()
        ? msgBox('🧳','Let’s plan this lekker trip','Add the trip dates and who’s coming, then everyone can start filling in the days.','<button class="primary" data-setup>Set up the trip</button>')
        : msgBox('🧳','Nothing here yet','The trip hasn’t been set up yet. Check back once the organiser has added the dates.');
      return;
    }
    if(S.tab==='days') renderDays(main, keepScroll); else if(S.tab==='travel') renderTravel(main); else renderIdeas(main);
  }

  function dayBlock(day, idx, total, compact){
    const list = actsOn(day);
    const cl = clashes(list);
    const isToday = day===todayStr();
    let h = `<section class="day"><div class="dhead"><div><h2>${esc(fmtLong(day))}${isToday?'<span class="tag-today">Today</span>':''}</h2><div class="dn2">Day ${idx+1} of ${total}${list.length?` · ${list.length} planned`:''}</div></div>`;
    if(list.length || flightsOn(day).length || stayEvents(day).length) h += `<button class="ghost" data-copy="${day}">Copy</button>`;
    h += `</div>`;
    h += dayBars(day);
    if(list.length) h += list.map(a => card(a, cl.get(a.id))).join('');
    else h += `<div class="empty${compact?' slim':''}">${compact?'Free day — nothing planned yet':'Nothing planned yet — time for a braai? 🔥'}</div>`;
    if(canEdit() && !compact) h += `<button class="addline" data-add="${day}">＋ Add to ${esc(fmtShort(day))}</button>`;
    return h + `</section>`;
  }

  /* Whole trip: one column per day; stays and flights are bars spanning the
     columns (a stay runs from the middle of check-in day to the middle of
     check-out day, like a hotel night), activities stack under each day. */
  function renderTimeline(days){
    const N = days.length, W = 72;                 // each day = 2 half-columns of W px
    const idx = d => days.indexOf(d);
    const t = todayStr();
    let h = `<div class="tl-wrap" id="tlWrap"><div class="tl" style="grid-template-columns:repeat(${N*2},${W}px)">`;
    let row = 1;
    days.forEach((d,i) => {
      const dt = pd(d);
      h += `<div class="tl-h ${d===t?'today':''}" data-day="${d}" style="grid-row:${row};grid-column:${2*i+1} / span 2">
        <div class="dow">${esc(dt.toLocaleDateString(undefined,{weekday:'short'}))}</div><div class="dn">${dt.getDate()}</div><div class="mo">${esc(dt.toLocaleDateString(undefined,{month:'short'}))} · Day ${i+1}</div></div>`;
    });
    row++;
    // Accommodation lanes
    const first = days[0], last = days[N-1];
    const spans = S.stays.filter(s => s.checkIn && s.checkOut && s.checkOut > first && s.checkIn <= last).map(s => {
      const a = idx(s.checkIn) >= 0 ? 2*idx(s.checkIn)+2 : 1;
      const b = idx(s.checkOut) >= 0 ? 2*idx(s.checkOut)+2 : 2*N+1;
      return {s, a, b};
    }).filter(x => x.b > x.a).sort((x,y) => x.a-y.a || y.b-x.b);
    const lanes = [];
    spans.forEach(x => { let L = lanes.findIndex(end => end <= x.a); if(L<0){ L = lanes.length; lanes.push(0); } lanes[L] = x.b; x.lane = L; });
    spans.forEach(x => {
      const n = nightsOf(x.s);
      h += `<div class="tl-bar stay" role="button" tabindex="0" data-stay="${esc(x.s.id)}" style="grid-row:${row + x.lane};grid-column:${x.a} / ${x.b};background:${esc(x.s.color)}"><span class="st">🏨 <span class="t">${esc(x.s.name)}${n?` · ${n} night${n>1?'s':''}`:''}</span></span></div>`;
    });
    row += lanes.length;
    // Flights (one lane per flight on the busiest day)
    const fl = days.map(d => flightsOn(d));
    const fLanes = Math.max(0, ...fl.map(f => f.length));
    fl.forEach((list,i) => list.forEach((f,k) => {
      h += `<div class="tl-bar flight" role="button" tabindex="0" data-flight="${esc(f.id)}" style="grid-row:${row + k};grid-column:${2*i+1} / span 2"><span class="st">✈️ <span class="t">${f.dep?esc(fmtTime(f.dep))+' ':''}${esc(route(f))}</span></span></div>`;
    }));
    row += fLanes;
    // Activities
    days.forEach((d,i) => {
      const list = actsOn(d);
      h += `<div class="tl-col ${d===t?'today':''}" style="grid-row:${row};grid-column:${2*i+1} / span 2">` +
        (list.length ? list.map(a => `<div class="tcard" role="button" tabindex="0" data-id="${esc(a.id)}" style="--c:${CATS[a.cat].color}">
            <div class="tt">${a.start?esc(fmtTime(a.start)):'Any time'}</div><div class="tn">${CATS[a.cat].emoji} ${esc(a.title)}</div></div>`).join('')
          : `<div class="tl-free">Free day</div>`) +
        (canEdit() ? `<button class="tl-add" data-add="${d}" aria-label="Add to ${esc(fmtShort(d))}">＋</button>` : '') +
        `</div>`;
    });
    h += `</div></div>`;
    if(!spans.length && !fLanes) h += `<p class="section-note">Add accommodation and flights in the 🧳 Travel tab and they’ll show as bars across the days.</p>`;
    else h += `<p class="section-note">Swipe sideways to see the whole trip. Tap a day to open it.</p>`;
    return h;
  }

  function renderDays(main, keepScroll){
    const oldTl = $('#tlWrap'); const keepTl = oldTl ? oldTl.scrollLeft : null;
    const days = tripDays();
    if(!S.sel || (S.sel!=='all' && !days.includes(S.sel))){
      S.sel = days.includes(todayStr()) ? todayStr() : (days[0] || 'all');
      S.scrollToSel = true;
    }
    const t = todayStr();
    let h = `<div class="strip" id="strip"><button class="dchip all ${S.sel==='all'?'on':''}" data-day="all"><span class="dow">Whole</span><span class="dn">trip</span><span class="dots"></span></button>`;
    h += days.map(d => {
      const n = S.acts.filter(a => a.date===d).length;
      const dt = pd(d);
      return `<button class="dchip ${d===S.sel?'on':''} ${d===t?'today':''}" data-day="${d}" aria-label="${esc(fmtLong(d))}"><span class="dow">${esc(dt.toLocaleDateString(undefined,{weekday:'short'}))}</span><span class="dn">${dt.getDate()}</span><span class="dots">${n?'●'.repeat(Math.min(n,4)):''}</span>${flightsOn(d).length?'<span class="fl">✈️</span>':''}${(() => { const st = stayFor(d); return st ? `<span class="sbar" style="background:${esc(st.color)}" title="${esc(st.name)}"></span>` : ''; })()}</button>`;
    }).join('') + `</div>`;
    if(!days.length) h += `<div class="empty">The trip dates look wrong. Open ⚙️ settings to fix them.</div>`;
    else if(S.sel==='all') h += renderTimeline(days);
    else h += dayBlock(S.sel, days.indexOf(S.sel), days.length, false);
    main.innerHTML = h;
    const strip = $('#strip');
    if(S.scrollToSel){
      const on = strip.querySelector('.dchip.on');
      if(on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth/2 + on.offsetWidth/2);
      S.scrollToSel = false;
    } else if(keepScroll!=null) strip.scrollLeft = keepScroll;
    const tl = $('#tlWrap');
    if(tl){
      if(keepTl!=null) tl.scrollLeft = keepTl;
      else { const td = days.indexOf(todayStr()); if(td > 0) tl.scrollLeft = Math.max(0, td*144 - 20); }
    }
  }

  /* ---------- Flights & accommodation ---------- */
  const STAY_COLORS = ['#007A4D','#8D5A2B','#C2185B','#00897B','#141414','#DE3831'];
  function normFlight(id, d){
    d = d || {};
    return { id, flightNo:String(d.flightNo||''), airline:String(d.airline||''), from:String(d.from||''), to:String(d.to||''),
      date: validDate(d.date) ? d.date : '', dep: mins(d.dep)!=null ? d.dep : '', arr: mins(d.arr)!=null ? d.arr : '',
      ref:String(d.ref||''), who: Array.isArray(d.who) ? d.who.filter(x => typeof x==='string') : [], notes:String(d.notes||''), createdAt:Number(d.createdAt)||0 };
  }
  function normStay(id, d){
    d = d || {};
    return { id, name:String(d.name||'Accommodation'), checkIn: validDate(d.checkIn) ? d.checkIn : '', checkOut: validDate(d.checkOut) ? d.checkOut : '',
      inTime: mins(d.inTime)!=null ? d.inTime : '', outTime: mins(d.outTime)!=null ? d.outTime : '', address:String(d.address||''),
      ref:String(d.ref||''), link:String(d.link||''), notes:String(d.notes||''),
      color: STAY_COLORS.includes(d.color) ? d.color : STAY_COLORS[0], createdAt:Number(d.createdAt)||0, geo: cleanGeo(d.geo) };
  }
  function sortFlights(a,b){ return (a.date||'9').localeCompare(b.date||'9') || (mins(a.dep)??9999)-(mins(b.dep)??9999); }
  function flightsOn(day){ return S.flights.filter(f => f.date===day).sort(sortFlights); }
  function stayFor(day){ return S.stays.find(s => s.checkIn && s.checkOut && s.checkIn<=day && day<s.checkOut); }
  function nightsOf(s){ return (s.checkIn && s.checkOut) ? Math.round((pd(s.checkOut)-pd(s.checkIn))/864e5) : 0; }
  function stayEvents(day){
    const out = [];
    S.stays.forEach(s => { if(s.checkOut===day) out.push({k:'out', s}); });
    S.stays.forEach(s => {
      if(s.checkIn===day) out.push({k:'in', s});
      else if(s.checkIn && s.checkOut && s.checkIn<day && day<s.checkOut) out.push({k:'night', s});
    });
    return out;
  }
  function route(f){ return [f.from, f.to].filter(Boolean).join(' → ') || 'Flight'; }
  function whoText(who){
    const ms = members(); const sel = ms.filter(m => who.includes(m.id));
    return (!sel.length || sel.length===ms.length) ? '' : sel.map(m => m.name).join(', ');
  }
  function flightBar(f, showDate){
    const sub = [f.flightNo, f.airline, f.arr?`lands ${fmtTime(f.arr)}`:'', f.ref?`Ref ${f.ref}`:'', whoText(f.who)].filter(Boolean).join(' · ');
    const when = [showDate && f.date ? fmtShort(f.date) : '', f.dep ? fmtTime(f.dep) : ''].filter(Boolean).join(' · ');
    return `<div class="bar flight" role="button" tabindex="0" data-flight="${esc(f.id)}"><span class="be">✈️</span><div class="bb">
      <div class="bm">${when?esc(when)+' · ':''}${esc(route(f))}</div>${sub?`<div class="bs">${esc(sub)}</div>`:''}</div></div>`;
  }
  function stayBar(ev){
    const s = ev.s; const n = nightsOf(s);
    let emo, main, sub;
    if(ev.k==='in'){ emo='🔑'; main=`Check in · ${s.name}`; sub=[s.inTime?`from ${fmtTime(s.inTime)}`:'', n?`${n} night${n>1?'s':''}`:'', s.address].filter(Boolean).join(' · '); }
    else if(ev.k==='out'){ emo='🧳'; main=`Check out · ${s.name}`; sub=[s.outTime?`by ${fmtTime(s.outTime)}`:'', s.ref?`Ref ${s.ref}`:''].filter(Boolean).join(' · '); }
    else { const i = Math.round((pd(ev.day||s.checkIn)-pd(s.checkIn))/864e5)+1; emo='🏨'; main=`Staying at ${s.name}`; sub=[`Night ${i} of ${n}`, s.address].filter(Boolean).join(' · '); }
    const style = ev.k==='out' ? `class="bar outline" style="--c:${esc(s.color)}"` : `class="bar" style="background:${esc(s.color)}"`;
    return `<div ${style} role="button" tabindex="0" data-stay="${esc(s.id)}"><span class="be">${emo}</span><div class="bb"><div class="bm">${esc(main)}</div>${sub?`<div class="bs">${esc(sub)}</div>`:''}</div></div>`;
  }
  function dayBars(day){
    const evs = stayEvents(day).map(e => ({...e, day}));
    return evs.filter(e => e.k==='out').map(stayBar).join('')
      + flightsOn(day).map(f => flightBar(f,false)).join('')
      + evs.filter(e => e.k!=='out').map(stayBar).join('');
  }
  function renderTravel(main){
    const fl = [...S.flights].sort(sortFlights);
    const st = [...S.stays].sort((a,b) => (a.checkIn||'9').localeCompare(b.checkIn||'9'));
    let h = `<h3 class="sec" style="margin-top:6px">✈️ Flights</h3>`;
    h += fl.length ? fl.map(f => flightBar(f,true)).join('') : `<div class="empty slim">No flights added yet.</div>`;
    if(canEdit()) h += `<button class="addline" data-addflight>＋ Add a flight</button>`;
    h += `<h3 class="sec">🏨 Accommodation</h3>`;
    h += st.length ? st.map(s => {
      const n = nightsOf(s);
      const sub = [s.checkIn&&s.checkOut ? `${fmtShort(s.checkIn)} → ${fmtShort(s.checkOut)}` : '', n?`${n} night${n>1?'s':''}`:'', s.address].filter(Boolean).join(' · ');
      return `<div class="bar" style="background:${esc(s.color)}" role="button" tabindex="0" data-stay="${esc(s.id)}"><span class="be">🏨</span><div class="bb"><div class="bm">${esc(s.name)}</div>${sub?`<div class="bs">${esc(sub)}</div>`:''}</div></div>`;
    }).join('') : `<div class="empty slim">No accommodation added yet.</div>`;
    if(canEdit()) h += `<button class="addline" data-addstay>＋ Add accommodation</button>`;
    h += `<p class="section-note" style="margin-top:16px">These show as bars on the calendar days they fall on.</p>`;
    main.innerHTML = h;
  }
  function armDelete(btn, fn){
    let armed = false;
    btn.addEventListener('click', async () => {
      if(!armed){ armed = true; btn.classList.add('confirm'); btn.textContent = 'Tap again to delete';
        setTimeout(() => { if(document.contains(btn)){ armed = false; btn.classList.remove('confirm'); btn.textContent = 'Delete'; } }, 3500); return; }
      btn.disabled = true;
      if(await fn()){ closeSheet(); toast('Deleted'); }
    });
  }

    return o + days.map(d => `<option value="${d}" ${d===sel?'selected':''}>${esc(fmtShort(d))}</option>`).join('');

        toast(a ? 'Saved' : (data.date ? `Added to ${fmtShort(data.date)}` : 'Added to Ideas'));
        if(data.date && S.tab==='days' && S.sel!=='all' && S.sel!==data.date && tripDays().includes(data.date)){ S.sel = data.date; S.scrollToSel = true; saveSel(); render(); }
      } else if(document.contains($('#fSave'))){ $('#fSave').disabled = false; $('#fSave').textContent = a?'Save changes':'Add to plan'; }
    });
    if(a){
      let armed = false;
      $('#fDel').addEventListener('click', async () => {
        if(!armed){ armed = true; $('#fDel').classList.add('confirm'); $('#fDel').textContent = 'Tap again to delete'; setTimeout(() => { const d=$('#fDel'); if(d){ armed=false; d.classList.remove('confirm'); d.textContent='Delete'; } }, 3500); return; }
        $('#fDel').disabled = true;
        const ok = await write(() => S.db.deleteAct(a.id));
        if(ok){ closeSheet(); toast('Deleted'); }
      });
    }
  }

  function openSettings(){
    const ro = !canEdit();
    const t = S.trip || {};
    const today = new Date();
    let start = validDate(t.start) ? t.start : ds(today);
    let end = validDate(t.end) ? t.end : ds(addDays(today,6));
    let mem = members().map(m => ({...m}));
    if(!mem.length) mem = [{id:uid(), name:'', color:PALETTE[0]}];
    const dis = ro ? 'disabled' : '';
    openSheet(`
      <div class="shead"><h2>${S.trip?'Trip settings':'Set up the trip'}</h2><button class="x" data-close aria-label="Close">✕</button></div>
      ${ro?'<div class="ro-note">Only Editors can change the trip settings.</div>':''}
      <form id="setForm" autocomplete="off">
        <label class="f" for="sName">Trip name</label>
        <input class="in" id="sName" maxlength="60" placeholder="e.g. Cape Town 2026" value="${esc(t.name||'')}" ${dis}>
        <div class="row2">
          <div><label class="f" for="sStart">First day</label><input class="in" type="date" id="sStart" value="${start}" ${dis}></div>
          <div><label class="f" for="sEnd">Last day</label><input class="in" type="date" id="sEnd" value="${end}" ${dis}></div>
        </div>
        <label class="f">Who's on the trip</label>
        <div id="sMem"></div>
        ${ro?'':'<button type="button" class="addline" id="sAddMem">＋ Add person</button><div class="hint">Tap a colour square to change someone’s colour.</div>'}
        <div class="err" id="sErr"></div>
        ${ro?'':`<div class="actions"><button type="submit" class="primary" id="sSave">${S.trip?'Save':'Start planning'}</button></div>`}
      </form>`);
    function drawMem(){
      $('#sMem').innerHTML = mem.map((m,i) => `<div class="mrow">
        <button type="button" class="swatch" style="background:${esc(m.color)}" data-sw="${i}" aria-label="Change colour" ${dis}>${esc(initials(m.name||'?'))}</button>
        <input class="in" data-mn="${i}" maxlength="30" placeholder="Name" value="${esc(m.name)}" ${dis}>
        ${ro||mem.length<2?'':`<button type="button" class="rm" data-rm="${i}" aria-label="Remove">✕</button>`}
      </div>`).join('');
    }
    drawMem();
    if(ro) return;
    $('#sMem').addEventListener('input', e => {
      const i = e.target.dataset.mn; if(i==null) return;
      mem[i].name = e.target.value;
      const sw = $('#sMem').querySelector(`[data-sw="${i}"]`); if(sw) sw.textContent = initials(e.target.value||'?');
    });
    $('#sMem').addEventListener('click', e => {
      const sw = e.target.closest('[data-sw]'), rm = e.target.closest('[data-rm]');
      if(sw){ const m = mem[sw.dataset.sw]; m.color = PALETTE[(PALETTE.indexOf(m.color)+1) % PALETTE.length]; drawMem(); }
      if(rm){ mem.splice(Number(rm.dataset.rm),1); drawMem(); }
    });
    $('#sAddMem').addEventListener('click', () => {
      const used = mem.map(m => m.color);
      mem.push({id:uid(), name:'', color: PALETTE.find(c => !used.includes(c)) || PALETTE[mem.length % PALETTE.length]});
      drawMem();
      const ins = $('#sMem').querySelectorAll('input'); ins[ins.length-1].focus();
    });
    let busy = false;
    $('#setForm').addEventListener('submit', async e => {
      e.preventDefault(); if(busy) return;
      const err = $('#sErr');
      const s = $('#sStart').value, en = $('#sEnd').value;
      if(!validDate(s) || !validDate(en)){ err.textContent = 'Pick both the first and last day.'; return; }
      if(pd(en) < pd(s)){ err.textContent = 'The last day can’t be before the first day.'; return; }
      if((pd(en)-pd(s))/864e5 > 90){ err.textContent = 'That’s a long trip! Keep it to 3 months or less.'; return; }
      const ms = mem.map(m => ({id:m.id, name:m.name.trim(), color:m.color})).filter(m => m.name);
      if(!ms.length){ err.textContent = 'Add at least one person.'; return; }
      busy = true; $('#sSave').disabled = true; $('#sSave').textContent = 'Saving…';
      const body = {name:$('#sName').value.trim() || 'Family Trip', start:s, end:en, members:ms, updatedAt:Date.now()};
      const ok = await write(() => S.db.saveTrip(body));
      busy = false;
      if(ok){ const first = !S.trip; closeSheet(); toast(first ? 'All set — start adding activities!' : 'Trip updated'); setTimeout(() => askWhoIfNeeded(), 1200); }
      else if(document.contains($('#sSave'))){ $('#sSave').disabled = false; $('#sSave').textContent = 'Save'; }
    });
  }
  $('#sheet').addEventListener('click', e => { if(e.target.closest('[data-close]')) closeSheet(); });

  /* ---------- Writes ---------- */
  async function saveActivity(id, data){
    const prev = id ? S.acts.find(x => x.id===id) : null;
    const body = {...data, by: (prev && prev.by) || S.me || '', createdAt: (prev && prev.createdAt) || Date.now(), updatedAt: Date.now()};
    return write(() => S.db.saveAct(id, body));
  }
  /* Changes show on this phone straight away and are sent when there's signal,
     so nobody waits on a slow connection mid-trip. */
  async function write(fn){
    let p;
    try{ p = fn(); }catch(e){ writeFailed(e); return false; }
    Promise.resolve(p).catch(writeFailed);
    return true;
  }
  function writeFailed(err){
    console.error(err);
    const code = err && err.code;
    if(!BLOB) toast('Couldn\u2019t create the shared plan. Check your signal and try again.', 5000);
    else toast('Couldn’t save that change. Please try again.', 4000);
  }

  /* ---------- Copy day ---------- */
  function dayText(day){
    const list = actsOn(day);
    const lines = [`${fmtLong(day)}`];
    stayEvents(day).filter(e => e.k==='out').forEach(e => lines.push(`🧳 Check out: ${e.s.name}${e.s.outTime?` by ${fmtTime(e.s.outTime)}`:''}`));
    flightsOn(day).forEach(f => lines.push(`✈️ ${f.dep?fmtTime(f.dep)+' ':''}${route(f)}${f.flightNo?` (${f.flightNo})`:''}${f.arr?`, lands ${fmtTime(f.arr)}`:''}`));
    stayEvents(day).filter(e => e.k==='in').forEach(e => lines.push(`🔑 Check in: ${e.s.name}${e.s.inTime?` from ${fmtTime(e.s.inTime)}`:''}${e.s.address?` — ${e.s.address}`:''}`));
    stayEvents(day).filter(e => e.k==='night').forEach(e => lines.push(`🏨 Staying at ${e.s.name}`));
    list.forEach(a => {
      const t = a.start ? fmtTime(a.start) + (a.end ? '–' + fmtTime(a.end) : '') : 'Any time';
      const ms = members(); const sel = ms.filter(m => a.who.includes(m.id));
      const w = (!sel.length || sel.length===ms.length) ? '' : ` (${sel.map(m=>m.name).join(', ')})`;
      lines.push(`• ${t} — ${CATS[a.cat].emoji} ${a.title}${a.place?` @ ${a.place}`:''}${w}`);
    });
    return lines.join('\n');
  }

  /* ---------- Toast ---------- */
  let toastT;
  function toast(msg, ms){
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }
  function saveSel(){ try{ localStorage.setItem('tripSel', S.sel||''); localStorage.setItem('tripTab', S.tab); }catch(e){} }

  /* ---------- Events ---------- */
  $('#main').addEventListener('click', async e => {
    if(e.target.closest('a')) return;
    const day = e.target.closest('[data-day]');
    if(day){ S.sel = day.dataset.day; saveSel(); render(); const on = $('#strip .dchip.on'); if(on) on.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'}); window.scrollTo({top:0,behavior:'smooth'}); return; }
    const add = e.target.closest('[data-add]');
    if(add){ openActivity(null, add.dataset.add); return; }
    const cp = e.target.closest('[data-copy]');
    if(cp){
      try{ await navigator.clipboard.writeText(dayText(cp.dataset.copy)); toast('Day plan copied — paste it in the family chat'); }
      catch(err){ toast('Couldn’t copy on this device'); }
      return;
    }
    const fb = e.target.closest('[data-flight]'); if(fb){ openFlight(fb.dataset.flight); return; }
    const sb = e.target.closest('[data-stay]'); if(sb){ openStay(sb.dataset.stay); return; }
    if(e.target.closest('[data-addflight]')){ openFlight(null); return; }
    if(e.target.closest('[data-addstay]')){ openStay(null); return; }
    if(e.target.closest('[data-setup]')){ openSettings(); return; }
    if(e.target.closest('[data-newtrip]')){ try{ localStorage.removeItem(LS('current')); }catch(err){} location.href = location.pathname; return; }
    const c = e.target.closest('[data-id]');
    if(c) openActivity(c.dataset.id);
  });
  $('#main').addEventListener('keydown', e => {
    if((e.key==='Enter'||e.key===' ') && e.target.matches('.card,.bar,.tl-bar,.tcard')){ e.preventDefault(); e.target.click(); }
  });
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if(!b) return;
    S.tab = b.dataset.tab; S.scrollToSel = true; saveSel(); render(); window.scrollTo({top:0});
  });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#shareBtn').addEventListener('click', openShare);
  function openShare(){
    const link = shareLink();
    openSheet(`<div class="shead"><h2>Share the trip</h2><button class="x" data-close aria-label="Close">✕</button></div>
      <p class="hint" style="font-size:14px;margin:0 0 12px">Send this link to the family. Anyone with it can see and add to the plan — no app or account needed.</p>
      <input class="in" id="shareLink" readonly value="${esc(link)}">
      <div class="actions"><button type="button" class="primary" id="copyLink">Copy link</button></div>
      <p class="hint">Tip: on a phone, open the link and use “Add to Home screen” so it opens like an app.</p>`);
    $('#shareLink').addEventListener('focus', e => e.target.select());
    $('#copyLink').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(link); toast('Link copied — paste it in the family chat'); }
      catch(e){ $('#shareLink').focus(); $('#shareLink').select(); toast('Press and hold the link to copy it'); }
    });
  }
  $('#members').addEventListener('click', e => { if(e.target.closest('[data-pickme]')) askWhoIfNeeded(true); });
  $('#fab').addEventListener('click', () => {
    if(S.tab==='ideas') return openActivity(null, '');
    if(S.tab==='travel') return openAddChooser();
    const days = tripDays();
    const d = S.sel && S.sel!=='all' ? S.sel : (days.includes(todayStr()) ? todayStr() : (days[0]||''));
    openActivity(null, d);
  });

  /* ---------- Boot ---------- */
  function markConfirmed(){
    if(S.confirmed && !S.offline) return;
    S.confirmed = true; S.offline = false; clearTimeout(loadTimer); renderBanner();
  }
  let loadTimer;
  /* ---------- Shared storage (Nostr relays) ----------
     Each trip item (settings, an activity, a stay, a flight) is its own small
     encrypted, signed message, saved to several relays at once. Two people
     editing different things can never overwrite each other, and changes made
     with no signal wait on the phone until it reconnects. */
  const KIND = 30078;
  let BLOB = null, K = null, NT = null, items = {}, outbox = [];
  const conns = {};
  const LS = k => 'tripPlan:' + k;
  const lsGet = k => { try{ return JSON.parse(localStorage.getItem(LS(k))); }catch(e){ return null; } };
  const lsSet = (k,v) => { try{ localStorage.setItem(LS(k), JSON.stringify(v)); }catch(e){} };
  function hashId(){ const m = location.hash.match(/^#trip-([A-Za-z0-9_-]{6,80})$/); return m ? m[1] : null; }
  function shareLink(){ return location.origin + location.pathname + '#trip-' + BLOB; }
  function clean(st){
    const out = {trip:null, acts:{}, stays:{}, flights:{}};
    if(st && typeof st==='object'){
      if(st.trip && typeof st.trip==='object') out.trip = st.trip;
      for(const c of ['acts','stays','flights']) if(st[c] && typeof st[c]==='object' && !Array.isArray(st[c]))
        for(const [k,v] of Object.entries(st[c])) if(v && typeof v==='object' && /^[A-Za-z0-9_-]{1,40}$/.test(k)) out[c][k] = v;
    }
    return out;
  }
  const b64e = bytes => { let s = ''; for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
  const b64d = str => { const s = str.replace(/-/g,'+').replace(/_/g,'/'); const bin = atob(s + '='.repeat((4 - s.length%4)%4)); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; };
  const hex = b => Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
  async function sha(str){ return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))); }
  async function loadLib(){
    for(const u of ['https://esm.sh/nostr-tools@2.7.0', 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.0/+esm']){
      try{ const m = await import(u); if(m && m.finalizeEvent && m.getPublicKey) return m; }catch(e){ console.warn('lib', u, e); }
    }
    throw new Error('lib');
  }
  async function deriveKeys(secret){
    const sk = await sha('trip-sk:' + secret);
    const aes = await crypto.subtle.importKey('raw', await sha('trip-aes:' + secret), 'AES-GCM', false, ['encrypt','decrypt']);
    const tag = hex(await sha('trip-tag:' + secret)).slice(0, 24);
    return {sk, pk: NT.getPublicKey(sk), tag, aes};
  }
  async function enc(obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, K.aes, new TextEncoder().encode(JSON.stringify(obj))));
    const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
    return b64e(all);
  }
  async function dec(str){
    const all = b64d(str);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(0,12)}, K.aes, all.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const newer = (cur, ts, id) => !cur || ts > cur.ts || (ts===cur.ts && id < cur.id);
  async function ingest(ev){
    if(!ev || ev.kind!==KIND || ev.pubkey!==K.pk || !Array.isArray(ev.tags)) return false;
    const d = (ev.tags.find(t => t[0]==='d') || [])[1] || '';
    if(!d.startsWith(K.tag + ':') || !newer(items[d], ev.created_at, ev.id)) return false;
    try{ if(NT.verifyEvent && !NT.verifyEvent(ev)) return false; }catch(e){ return false; }
    let p; try{ p = await dec(ev.content); }catch(e){ return false; }
    if(!p || !['trip','acts','stays','flights'].includes(p.col) || typeof p.id!=='string') return false;
    if(!newer(items[d], ev.created_at, ev.id)) return false;
    items[d] = {ts:ev.created_at, id:ev.id, col:p.col, iid:p.id, del:!!p.del, body: p.del ? null : (p.body || null)};
    return true;
  }
  let viewT = null, cacheT = null;
  function scheduleView(){ if(!viewT) viewT = setTimeout(() => { viewT = null; view(); }, 60); }
  function saveCacheSoon(){ clearTimeout(cacheT); cacheT = setTimeout(() => lsSet('items:' + BLOB, items), 400); }
  function view(){
    const st = {trip:null, acts:{}, stays:{}, flights:{}};
    for(const it of Object.values(items)){
      if(it.del || !it.body) continue;
      if(it.col==='trip') st.trip = it.body; else st[it.col][it.iid] = it.body;
    }
    const s = clean(st);
    S.trip = s.trip; if(S.trip || S.confirmed) S.tripLoaded = true;
    S.acts = Object.entries(s.acts).map(([id,d]) => norm({id, data:() => d}));
    S.stays = Object.entries(s.stays).map(([id,d]) => normStay(id,d));
    S.flights = Object.entries(s.flights).map(([id,d]) => normFlight(id,d));
    render(); askWhoIfNeeded();
  }
  async function put(col, id, body, del){
    const d = `${K.tag}:${col}:${id}`;
    const cur = items[d];
    let ts = Math.floor(Date.now()/1000); if(cur && cur.ts >= ts) ts = cur.ts + 1;
    const content = await enc({col, id, body: del ? null : body, del: !!del});
    const ev = NT.finalizeEvent({kind:KIND, created_at:ts, tags:[['d', d], ['t', K.tag]], content}, K.sk);
    items[d] = {ts, id:ev.id, col, iid:id, del:!!del, body: del ? null : body};
    lsSet('items:' + BLOB, items);
    outbox = outbox.filter(e => ((e.tags.find(t => t[0]==='d')||[])[1]) !== d);
    outbox.push(ev); lsSet('outbox:' + BLOB, outbox);
    scheduleView(); sendAll(ev); renderBanner();
  }
  const anyOpen = () => Object.values(conns).some(c => c.open);
  function sendAll(ev){ for(const c of Object.values(conns)) if(c.open){ try{ c.ws.send(JSON.stringify(['EVENT', ev])); }catch(e){} } }
  function connect(url){
    const prev = conns[url];
    let ws; try{ ws = new WebSocket(url); }catch(e){ return; }
    const c = {url, ws, open:false, retry: prev ? prev.retry : 0};
    conns[url] = c;
    ws.onopen = () => {
      c.open = true; c.retry = 0;
      ws.send(JSON.stringify(['REQ', 'trip', {kinds:[KIND], authors:[K.pk], '#t':[K.tag], limit:3000}]));
      outbox.forEach(ev => ws.send(JSON.stringify(['EVENT', ev])));
      if(S.offline){ S.offline = false; renderBanner(); }
    };
    ws.onmessage = async m => {
      let msg; try{ msg = JSON.parse(m.data); }catch(e){ return; }
      if(msg[0]==='EVENT' && msg[1]==='trip'){ if(await ingest(msg[2])){ saveCacheSoon(); scheduleView(); } }
      else if(msg[0]==='EOSE'){ if(!S.confirmed){ S.tripLoaded = true; markConfirmed(); view(); } }
      else if(msg[0]==='OK' && (msg[2]===true || /duplicate|replaced|newer/i.test(msg[3]||''))){
        const n = outbox.length; outbox = outbox.filter(e => e.id!==msg[1]);
        if(outbox.length!==n){ lsSet('outbox:' + BLOB, outbox); renderBanner(); }
      }
    };
    ws.onerror = () => {};
    ws.onclose = () => {
      c.open = false;
      if(conns[url]!==c) return;
      if(!anyOpen()) setTimeout(() => { if(!anyOpen() && BLOB){ S.offline = true; renderBanner(); } }, 4000);
      c.retry = Math.min(c.retry + 1, 6);
      setTimeout(() => { if(conns[url]===c && !document.hidden) connect(url); }, 1000 * Math.pow(2, c.retry));
    };
  }
  function reconnect(){ if(!K) return; RELAYS.forEach(u => { const c = conns[u]; if(!c || c.ws.readyState > 1) connect(u); }); }
  async function useBlob(id){
    BLOB = id;
    try{ localStorage.setItem(LS('current'), id); }catch(e){}
    if(hashId()!==id) history.replaceState(null, '', '#trip-' + id);
    K = await deriveKeys(id);
    const cached = lsGet('items:' + id); items = (cached && typeof cached==='object') ? cached : {};
    const ob = lsGet('outbox:' + id); outbox = Array.isArray(ob) ? ob : [];
    try{ S.me = localStorage.getItem('tripMe:' + id) || null; }catch(e){ S.me = null; }
    if(Object.keys(items).length){ S.tripLoaded = true; view(); } else render();
    loadTimer = setTimeout(() => { if(!S.confirmed){ S.offline = true; render(); } }, 10000);
    RELAYS.forEach(connect);
  }
  const newSecret = () => b64e(crypto.getRandomValues(new Uint8Array(24)));
  const store = {
    saveTrip: async body => {
      if(!BLOB){ await useBlob(newSecret()); S.confirmed = true; clearTimeout(loadTimer); }
      return put('trip', 'main', body);
    },
    saveAct: (id, body) => put('acts', id || ('a' + Date.now().toString(36) + uid()), body),
    deleteAct: id => put('acts', id, null, true),
    saveItem: (col, id, body) => put(col, id || (col[0] + Date.now().toString(36) + uid()), body),
    deleteItem: (col, id) => put(col, id, null, true)
  };
  async function boot(){
    S.db = store;
    let id = hashId();
    if(!id){ try{ id = localStorage.getItem(LS('current')); }catch(e){} }
    try{ NT = await loadLib(); }catch(e){ S.booting = false; S.libFail = true; render(); return; }
    S.booting = false;
    if(!id){ S.tripLoaded = true; S.confirmed = true; render(); return; }
    await useBlob(id);
  }
  setInterval(() => { if(BLOB && outbox.length && !document.hidden) outbox.forEach(sendAll); }, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) reconnect(); });
  window.addEventListener('online', reconnect);
  window.addEventListener('hashchange', () => { const id = hashId(); if(id && id!==BLOB) location.reload(); });

  render();
  boot();
})();
</script>
</body>
</html>
