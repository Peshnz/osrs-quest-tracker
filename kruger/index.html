<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kruger Tick List has moved</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2f3b1f;color:#fff7e6;font:17px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{display:inline-block;margin-top:14px;background:#d9822b;color:#1f1608;font-weight:700;padding:12px 20px;border-radius:12px;text-decoration:none}p{max-width:30em}</style>
</head><body><main><h1>Kruger Tick List has moved</h1><p>Open the new address and install it from there. Your ticks, location and plan carry over automatically. You can then remove this old icon from your home screen.</p><a href="https://peshnz.github.io/kruger-tick-list/">Open the new app</a></main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/kruger/'))r.unregister()}));if(window.caches)caches.keys().then(k=>k.filter(x=>x.startsWith('kruger-')).forEach(x=>caches.delete(x)));</script>
</body></html>
