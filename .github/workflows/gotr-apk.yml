name: Build GOTR overlay app

on:
  push:
    paths:
      - 'android/gotr-overlay/**'
      - '.github/workflows/gotr-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android/gotr-overlay
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/gotr-overlay/app/build/outputs/apk/release/app-release.apk gotr-timer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gotr-timer-${{ github.run_number }}
          name: GOTR Timer build ${{ github.run_number }}
          body: Floating Guardians of the Rift portal timer. Download gotr-timer.apk on your Android phone and install it.
          files: gotr-timer.apk
          make_latest: true
